name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 插件依赖 DSH 自带的两个包（不随本仓提交）；从公共 registry 装到工作区
      - name: Install DSH-provided deps
        run: npm install --no-save --no-audit --no-fund @deepseek-ai/schemastery @deepseek-ai/dsh-llm

      - name: Syntax check (5 plugins)
        run: npm run check

      # 让"账本进 CI"真的成立：不止跑校验器自测，还要校验一份真实样例账本
      - name: Validate sample coverage ledger
        run: node src/domain/ledger-validator.mjs ledger-samples/minimal-valid.json

      - name: Unit tests (core + convergence + plugins + budget + ledger-validator)
        run: npm test
